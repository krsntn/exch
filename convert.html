<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111317">
  <title>Price Converter</title>
  <link rel="icon" href="favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="nav">
      <a href="index.html">Compare</a>
      <a href="convert.html" aria-current="page">Convert</a>
    </nav>

    <header class="top">
      <h1>How much is it?</h1>
    </header>

    <section class="price-panel">
      <label for="price" class="total-label">Price</label>
      <div class="row">
        <span id="price-currency" class="unit"></span>
        <input id="price" class="amount price-input" inputmode="decimal" placeholder="0" autofocus autocomplete="off">
      </div>
      <p id="price-error" class="error" hidden></p>
      <p id="home-cost" class="home-cost" aria-live="polite"></p>
      <p id="rate-line" class="rate"></p>
      <p id="source-error" class="error" hidden></p>
    </section>

    <section class="settings">
      <p class="total-label source-label" id="source-label">Rate from</p>
      <div class="segmented" role="group" aria-labelledby="source-label">
        <button type="button" data-source="quote0">Quote 1</button>
        <button type="button" data-source="quote1">Quote 2</button>
        <button type="button" data-source="rate">Rate</button>
        <button type="button" data-source="amounts">Amounts</button>
      </div>

      <div id="rate" class="card source-card" hidden>
        <div class="row rate-row">
          <button type="button" class="side" id="rate-base" aria-label="Flip the rate"></button>
          <span class="unit">1</span>
          <span class="unit" aria-hidden="true">=</span>
          <span class="unit" id="rate-other"></span>
          <input id="rate-value" class="amount" inputmode="decimal" placeholder="0" aria-label="Rate">
        </div>
      </div>

      <div id="amounts" class="card source-card" hidden>
        <div class="row" data-row="0">
          <button type="button" class="side" aria-label="Flip currencies"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="First amount">
        </div>
        <div class="equals" aria-hidden="true">=</div>
        <div class="row" data-row="1">
          <button type="button" class="side" aria-label="Flip currencies"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="Second amount">
        </div>
      </div>
    </section>
  </main>

  <script src="compare.js"></script>
  <script src="shared.js"></script>
  <script src="convert.js"></script>
</body>
</html>
