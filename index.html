<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // On app launch (start_url is index.html?launch), open the page the user used last.
    try {
      if (/[?&]launch\b/.test(location.search) && localStorage.getItem('exch:page') === 'convert') {
        location.replace('convert.html');
      }
    } catch (e) { /* storage blocked: stay on Compare */ }
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111317">
  <title>Exch · Compare</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="apple-mobile-web-app-title" content="Exch">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <nav class="nav">
      <a href="index.html" aria-current="page">Compare</a>
      <a href="convert.html">Convert</a>
    </nav>

    <header class="top">
      <h1>Which rate is better?</h1>
      <button id="clear" type="button" class="clear">Clear</button>
    </header>

    <section class="direction" aria-label="Direction">
      <label class="field">
        <span>I give</span>
        <input id="give-currency" class="currency-input" maxlength="3"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
      <button id="swap" type="button" class="swap" aria-label="Swap give and want currencies">⇄</button>
      <label class="field">
        <span>I want</span>
        <input id="want-currency" class="currency-input" maxlength="3"
               autocomplete="off" autocapitalize="characters" spellcheck="false">
      </label>
    </section>
    <p id="direction-error" class="error" hidden></p>

    <p class="hint">Type each quote exactly as you see it. Tap a currency to flip it.</p>

    <section class="quotes">
      <article class="card" data-quote="0">
        <h2 class="name">Quote 1</h2>
        <div class="row" data-row="0">
          <button type="button" class="side" aria-label="Flip currencies in Quote 1"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="Quote 1 first amount">
        </div>
        <div class="equals" aria-hidden="true">=</div>
        <div class="row" data-row="1">
          <button type="button" class="side" aria-label="Flip currencies in Quote 1"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="Quote 1 second amount">
        </div>
        <p class="rate"></p>
        <p class="error" hidden></p>
      </article>

      <article class="card" data-quote="1">
        <h2 class="name">Quote 2</h2>
        <div class="row" data-row="0">
          <button type="button" class="side" aria-label="Flip currencies in Quote 2"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="Quote 2 first amount">
        </div>
        <div class="equals" aria-hidden="true">=</div>
        <div class="row" data-row="1">
          <button type="button" class="side" aria-label="Flip currencies in Quote 2"></button>
          <input class="amount" inputmode="decimal" placeholder="0" aria-label="Quote 2 second amount">
        </div>
        <p class="rate"></p>
        <p class="error" hidden></p>
      </article>
    </section>

    <section id="result" class="result" aria-live="polite"></section>

    <section class="total">
      <label for="exchange-amount" class="total-label">I plan to exchange</label>
      <div class="row">
        <span id="exchange-currency" class="unit"></span>
        <input id="exchange-amount" class="amount" inputmode="decimal" placeholder="0">
      </div>
      <p id="exchange-error" class="error" hidden></p>
      <div id="total-result" aria-live="polite"></div>
    </section>
  </main>

  <script src="pwa.js"></script>
  <script src="compare.js"></script>
  <script src="shared.js"></script>
  <script src="currency-picker.js"></script>
  <script src="app.js"></script>
</body>
</html>
